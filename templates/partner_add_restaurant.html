{% extends "base.html" %}
{% block title %}Ajouter un commerce - QuickFood{% endblock %}
{% block content %}
<div style="max-width:650px;margin:50px auto;padding:0 20px;">
  <a href="{{ url_for('partner.dashboard') }}" style="color:#dc2626;text-decoration:none;font-weight:600;">
    <i class="fas fa-arrow-left"></i> Retour au dashboard
  </a>
  <div style="background:white;border-radius:16px;padding:30px;box-shadow:0 8px 24px rgba(0,0,0,0.08);margin-top:20px;">
    <h3 style="font-weight:800;margin-bottom:25px;">Ajouter un commerce</h3>
    <form method="POST" enctype="multipart/form-data">

      <!-- Type de commerce -->
      <div class="mb-4">
        <label class="form-label fw-semibold">Type de commerce *</label>
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <label style="flex:1;min-width:130px;border:2px solid #e5e7eb;border-radius:12px;padding:14px;cursor:pointer;text-align:center;transition:.2s;" id="lbl-restaurant">
            <input type="radio" name="category" value="restaurant" checked style="display:none;">
            <div style="font-size:2rem;">🍽️</div>
            <strong style="font-size:.88rem;display:block;margin-top:4px;">Restaurant</strong>
          </label>
          <label style="flex:1;min-width:130px;border:2px solid #e5e7eb;border-radius:12px;padding:14px;cursor:pointer;text-align:center;transition:.2s;" id="lbl-supermarche">
            <input type="radio" name="category" value="supermarche" style="display:none;">
            <div style="font-size:2rem;">🛒</div>
            <strong style="font-size:.88rem;display:block;margin-top:4px;">Supermarché</strong>
          </label>
          <label style="flex:1;min-width:130px;border:2px solid #e5e7eb;border-radius:12px;padding:14px;cursor:pointer;text-align:center;transition:.2s;" id="lbl-fruiterie">
            <input type="radio" name="category" value="fruiterie" style="display:none;">
            <div style="font-size:2rem;">🍎</div>
            <strong style="font-size:.88rem;display:block;margin-top:4px;">Fruiterie</strong>
          </label>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Nom *</label>
        <input type="text" name="name" class="form-control" required placeholder="Ex: Chez Fatou, Supermarché Casino...">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Description</label>
        <textarea name="description" class="form-control" rows="3" placeholder="Spécialités, produits disponibles..."></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">
          Adresse
          <button type="button" class="btn btn-sm btn-outline-danger ms-2" onclick="geoFill()">
            <i class="fas fa-map-marker-alt"></i> Géolocaliser
          </button>
        </label>
        <input type="text" name="address" id="addr" class="form-control" placeholder="Ex: Rue 10, Almadies, Dakar">
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label fw-semibold">Latitude</label>
          <input type="number" step="any" name="latitude" id="lat" class="form-control" placeholder="14.6937">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label fw-semibold">Longitude</label>
          <input type="number" step="any" name="longitude" id="lng" class="form-control" placeholder="-17.4441">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Rayon de livraison (km)</label>
        <input type="number" step="0.5" min="1" max="50" name="delivery_radius_km" class="form-control" value="5">
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Image</label>
        <input type="file" name="image" class="form-control" accept="image/*">
      </div>
      <button type="submit" class="btn btn-danger w-100 fw-bold">Créer le commerce</button>
    </form>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
// Style cartes radio
document.querySelectorAll('input[name="category"]').forEach(function(radio){
  radio.addEventListener('change',function(){
    ['lbl-restaurant','lbl-supermarche','lbl-fruiterie','lbl-boulangerie'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){el.style.borderColor='#e5e7eb';el.style.background='white';}
    });
    var lbl=document.getElementById('lbl-'+this.value);
    if(lbl){lbl.style.borderColor='#dc2626';lbl.style.background='#fef2f2';}
  });
});
document.getElementById('lbl-restaurant').style.borderColor='#dc2626';
document.getElementById('lbl-restaurant').style.background='#fef2f2';

function geoFill(){
  if(!navigator.geolocation){alert("Non supporté.");return;}
  navigator.geolocation.getCurrentPosition(function(pos){
    var la=pos.coords.latitude,lo=pos.coords.longitude;
    document.getElementById('lat').value=la.toFixed(6);
    document.getElementById('lng').value=lo.toFixed(6);
    fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+la+'&lon='+lo+'&accept-language=fr')
      .then(function(r){return r.json();}).then(function(d){document.getElementById('addr').value=d.display_name||'';});
  },function(){alert("Accès refusé.");});
}
</script>
{% endblock %}
