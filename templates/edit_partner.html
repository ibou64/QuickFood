{% extends "base.html" %}
{% block title %}Mon profil - QuickFood{% endblock %}
{% block content %}
<div style="max-width:550px;margin:50px auto;padding:0 20px;">
  <a href="{{ url_for('partner.dashboard') }}" style="color:#dc2626;text-decoration:none;font-weight:600;">
    <i class="fas fa-arrow-left"></i> Retour
  </a>
  <div style="background:white;border-radius:16px;padding:30px;box-shadow:0 8px 24px rgba(0,0,0,0.08);margin-top:20px;">
    <h3 style="font-weight:800;color:#dc2626;margin-bottom:25px;">Mon profil partenaire</h3>
    <form method="POST" action="{{ url_for('partner.edit_profile') }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Nom</label>
        <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
      </div>
      <hr>
      <p class="text-muted small">Laissez vide pour conserver le mot de passe actuel</p>
      <div class="mb-3">
        <label class="form-label fw-semibold">Nouveau mot de passe</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••">
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Confirmer le mot de passe</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-danger w-100 fw-bold py-2">
        <i class="fas fa-save"></i> Mettre à jour
      </button>
    </form>
  </div>
</div>
{% endblock %}
